services:
  broker:
    image: confluentinc/cp-server:8.1.0
    hostname: broker
    ports:
      - "9093:9093"   # Kafka, PLAINTEXT (super.users bypass the authorizer here)
      - "8090:8090"   # MDS REST API -- what targets/cp_mds.py / apply_to_mds.py talk to
    environment:
      # Generated once with: docker run --rm confluentinc/cp-server:8.1.0 kafka-storage random-uuid
      # Override with `CLUSTER_ID=... docker compose up -d` for a fresh cluster.
      CLUSTER_ID: ${CLUSTER_ID:-Y0TWB4uSQfO0oZyvyng4Yw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094,TOKEN://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093,TOKEN://broker:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,TOKEN:SASL_PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- RBAC / MDS ---
      # "mds" is a super.user so it can bypass the authorizer to create role
      # bindings for everyone else without needing one of its own.
      KAFKA_SUPER_USERS: "User:ANONYMOUS;User:mds"
      KAFKA_AUTHORIZER_CLASS_NAME: io.confluent.kafka.security.authorizer.ConfluentServerAuthorizer
      KAFKA_CONFLUENT_AUTHORIZER_ACCESS_RULE_PROVIDERS: CONFLUENT
      KAFKA_CONFLUENT_METADATA_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_METADATA_SERVER_TOKEN_KEY_PATH: /tmp/rbac/tokenKeypair.pem
      KAFKA_CONFLUENT_METADATA_SERVER_LISTENERS: http://0.0.0.0:8090
      KAFKA_CONFLUENT_METADATA_SERVER_ADVERTISED_LISTENERS: http://localhost:8090
      KAFKA_CONFLUENT_METADATA_SERVER_AUTHENTICATION_METHOD: BEARER
      # FILE user store instead of LDAP -- login.properties below is the
      # entire "identity provider" for this minimal setup.
      KAFKA_CONFLUENT_METADATA_SERVER_USER_STORE: FILE
      KAFKA_CONFLUENT_METADATA_SERVER_USER_STORE_FILE_PATH: /tmp/rbac/login.properties

      # The TOKEN listener is how a Kafka client authenticates to the broker
      # itself using a bearer token obtained from MDS's REST API, instead of
      # a username/password -- required for the broker to start with RBAC
      # enabled even though this test only exercises the REST side (8090).
      KAFKA_LISTENER_NAME_TOKEN_SASL_ENABLED_MECHANISMS: OAUTHBEARER
      KAFKA_LISTENER_NAME_TOKEN_OAUTHBEARER_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required
        publicKeyPath="/tmp/rbac/tokenPublicKey.pem";
      KAFKA_LISTENER_NAME_TOKEN_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS: io.confluent.kafka.server.plugins.auth.token.TokenBearerValidatorCallbackHandler
      KAFKA_LISTENER_NAME_TOKEN_OAUTHBEARER_SASL_LOGIN_CALLBACK_HANDLER_CLASS: io.confluent.kafka.server.plugins.auth.token.TokenBearerServerLoginCallbackHandler
    volumes:
      - ./secrets/tokenKeypair.pem:/tmp/rbac/tokenKeypair.pem:ro
      - ./secrets/tokenPublicKey.pem:/tmp/rbac/tokenPublicKey.pem:ro
      - ./login.properties:/tmp/rbac/login.properties:ro
