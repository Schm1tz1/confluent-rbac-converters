# Sample export_cc_acls.py output for exercising acl_to_rolebindings.py and
# apply_rolebindings.py / apply_to_mds.py without a live Confluent Cloud
# cluster. Covers one representative case for every branch of the
# translation policy documented in README.md:
#
#   payments (READ/WRITE), orders- (PREFIXED WRITE), metrics (DESCRIBE,
#   CREATE+DELETE grouping), config-topic (DESCRIBE_CONFIGS, ALTER_CONFIGS),
#   legacy-topic (ALTER), scratch (ALL), orders-consumer group (READ+DESCRIBE
#   grouping), txn-1 transactional ID (WRITE+READ), kafka-cluster (CLUSTER,
#   skipped unless --cluster-role is passed), blocked-topic (DENY, skipped),
#   audit-topic (non-* host, skipped), any-topic (wildcard principal,
#   skipped), reg.* (MATCH pattern_type, skipped), legacy-normalized
#   (UserV2:* principal normalization), and a bare "*" group name (stays a
#   wildcard CRN pattern rather than being skipped).
api_version: kafka/v3
kind: KafkaAclList
metadata:
  cluster_id: lkc-test001
  source_url: https://pkc-example.aws.confluent.cloud/kafka/v3/clusters/lkc-test001/acls
  retrieved_at: '2026-09-17T00:00:00+00:00'
  count: 21
